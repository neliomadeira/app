<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" fill="none">
  <!-- Escudo -->
  <path d="M50 8 L88 22 L88 65 Q88 95 50 112 Q12 95 12 65 L12 22 Z" fill="#003B8E" stroke="#000" stroke-width="3"/>
  <!-- Metade amarela (diagonal) -->
  <clipPath id="shield">
    <path d="M50 8 L88 22 L88 65 Q88 95 50 112 Q12 95 12 65 L12 22 Z"/>
  </clipPath>
  <polygon points="12,80 88,22 88,112 12,112" fill="#FFD100" clip-path="url(#shield)"/>
  <!-- Faixa diagonal branca -->
  <rect x="8" y="48" width="84" height="18" fill="white" transform="rotate(-35 50 57)" clip-path="url(#shield)"/>
  <!-- Texto JS na faixa -->
  <text x="50" y="63" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="13" fill="#000" transform="rotate(-35 50 57)">JS</text>
  <!-- Contorno escudo -->
  <path d="M50 8 L88 22 L88 65 Q88 95 50 112 Q12 95 12 65 L12 22 Z" fill="none" stroke="#000" stroke-width="3.5"/>
  <!-- Águia simplificada -->
  <ellipse cx="50" cy="10" rx="6" ry="5" fill="#111"/>
  <path d="M20 14 Q35 8 50 10 Q65 8 80 14 Q70 4 50 6 Q30 4 20 14Z" fill="#111"/>
  <path d="M15 18 Q22 10 30 12" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M85 18 Q78 10 70 12" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
</svg>
